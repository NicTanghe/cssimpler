[package]
name = "cssimpler-renderer"
version.workspace = true
edition.workspace = true

[features]
default = []
gpu-viewport = ["dep:wgpu", "dep:pollster", "dep:openusd", "dep:openusd-schemas", "dep:bytemuck", "dep:glam", "dep:windows", "dep:x11rb", "dep:x11-dl", "dep:block2", "objc2-quartz-core/CAMetalLayer"]

[dependencies]
ab_glyph.workspace = true
cssimpler-core.workspace = true
font8x8.workspace = true
softbuffer.workspace = true
winit.workspace = true
wgpu = { version = "30.0", optional = true }
pollster = { version = "0.4", optional = true }
openusd = { version = "0.8", optional = true }
openusd-schemas = { version = "0.8", features = ["geom", "shade", "lux"], optional = true }
bytemuck = { version = "1.25", features = ["derive"], optional = true }
glam = { version = "0.34", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "dl-libxcb", "shape", "render", "composite"], optional = true }
x11-dl = { version = "2.21", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi"], optional = true }
winapi = { version = "0.3.9", features = ["winuser"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = { version = "0.6.4", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSObject", "NSString"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CATransaction"] }
